name: Production indexer

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-indexer
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Apply additive index schema
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MIGRATION_URL: https://arc-signal.xyz/api/cron/migrate-index
        run: |
          test -n "$CRON_SECRET"
          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --retry 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 45 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$MIGRATION_URL"

      - name: Advance finalized Arc index
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          INDEX_URL: https://arc-signal.xyz/api/cron/index
        run: |
          test -n "$CRON_SECRET"
          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --retry 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 55 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$INDEX_URL"

      - name: Advance finalized ArcSignal V2 index when configured
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          INDEX_V2_URL: https://arc-signal.xyz/api/cron/index-v2
        run: |
          test -n "$CRON_SECRET"
          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --retry 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 55 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$INDEX_V2_URL"

      - name: Resolve due markets
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MAINTENANCE_URL: https://arc-signal.xyz/api/cron/maintain
        run: |
          test -n "$CRON_SECRET"
          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --retry 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 55 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$MAINTENANCE_URL"

      - name: Promote selected external intelligence into V2 when enabled
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PROMOTE_LIVE_URL: https://arc-signal.xyz/api/cron/promote-live-markets
        run: |
          test -n "$CRON_SECRET"
          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --retry 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 55 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$PROMOTE_LIVE_URL"

      - name: Reconcile external settlement sources
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SETTLE_EXTERNAL_URL: https://arc-signal.xyz/api/cron/settle-external-markets
        run: |
          test -n "$CRON_SECRET"
          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --retry 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 55 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$SETTLE_EXTERNAL_URL"

      - name: Maintain ArcSignal V2 lifecycle
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MAINTAIN_V2_URL: https://arc-signal.xyz/api/cron/maintain-v2
        run: |
          test -n "$CRON_SECRET"
          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --retry 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 55 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$MAINTAIN_V2_URL"
      - name: Generate bounded Signal Intelligence coverage
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SIGNAL_URL: https://arc-signal.xyz/api/cron/signals
        run: |
          test -n "$CRON_SECRET"
          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --retry 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 240 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "Content-Type: application/json" \
            --data '{"action":"generate-scheduled","maxMarkets":1}' \
            "$SIGNAL_URL"
