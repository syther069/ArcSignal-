name: Production indexer

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-indexer
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Apply additive index schema
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MIGRATION_URL: https://arc-signal.xyz/api/cron/migrate-index
        run: |
          test -n "$CRON_SECRET"
          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --retry 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 30 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$MIGRATION_URL"

      - name: Advance finalized Arc index
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          INDEX_URL: https://arc-signal.xyz/api/cron/index
        run: |
          test -n "$CRON_SECRET"
          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --retry 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 55 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$INDEX_URL"

      - name: Resolve due markets
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MAINTENANCE_URL: https://arc-signal.xyz/api/cron/maintain
        run: |
          test -n "$CRON_SECRET"
          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --retry 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 55 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$MAINTENANCE_URL"
